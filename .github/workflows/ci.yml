name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: set up node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        run: npm ci --include=dev --prefix frontend

      - name: lint frontend
        run: npm run lint --prefix frontend

      - name: build frontend
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'

      - name: run go tests
        run: |
          modules=$(go list -m -f '{{.Dir}}')
          for module in $modules; do
            echo "--- running tests in module: $module ---"
            (cd "$module" && go test -v ./...)
          done

  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: creator-service
            context: .
            file: ./services/creator-service/Dockerfile
            build_args: APP_NAME=creator
          - image: redirector-service
            context: .
            file: ./services/redirector-service/Dockerfile
            build_args: APP_NAME=redirector
          - image: analytics-service
            context: .
            file: ./services/analytics-service/Dockerfile
            build_args: APP_NAME=analytics
          - image: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: VITE_API_URL=/api
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
